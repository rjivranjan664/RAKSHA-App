    <link rel="icon" type="image/svg+xml" href="/raksha-mark.svg" />

      content="RAKSHA - Risk Awareness, Knowledge, Safety & Humanitarian Action"
    />
    <title>RAKSHA — Emergency Resilience Platform</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("raksha_theme");
          const theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
